# ============================================================
#  AgentShield — Docker Compose
# ============================================================
#  Spins up PostgreSQL for local development.
#  Usage:  AGENTSHIELD_DB_PASSWORD=<password> docker compose up -d
#          (or put AGENTSHIELD_DB_PASSWORD in a .env file next to this one)
#  Stop:   docker compose down
#  Reset:  docker compose down -v  (deletes all data)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentshield-postgres
    environment:
      POSTGRES_DB: agentshield
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: ${AGENTSHIELD_DB_PASSWORD:?Set AGENTSHIELD_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
