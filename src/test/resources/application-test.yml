# ============================================================
#  Test profile ("test")
# ============================================================
# Layered on top of src/main/resources/application.yml when a test
# runs with @ActiveProfiles("test"). Uses an in-memory H2 database and
# fixed test credentials, so no environment variables are needed.

spring:
  datasource:
    url: jdbc:h2:mem:agentshield_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 0  # Random port for tests

agentshield:
  jwt:
    secret: TestSecretKeyForJWTTokenGenerationInTestEnvironment2024!
    expiration-ms: 3600000
  approval:
    expiration-hours: 1
