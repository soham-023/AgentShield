# ============================================================
#  Test Configuration
# ============================================================
# Uses H2 in-memory database so tests run without PostgreSQL.

spring:
  datasource:
    url: jdbc:h2:mem:agentshield_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 0  # Random port for tests

agentshield:
  jwt:
    secret: TestSecretKeyForJWTTokenGenerationInTestEnvironment2024!
    expiration-ms: 3600000
  approval:
    expiration-hours: 1
