# ============================================================
#  AgentShield — Application Configuration
# ============================================================
# Spring Boot reads this file automatically at startup.
# We use YAML format instead of .properties because it's
# more readable for nested configurations.
# ============================================================

spring:
  application:
    name: AgentShield

  # ---- Database (PostgreSQL) ----
  # The password has no default: set AGENTSHIELD_DB_PASSWORD or startup fails.
  datasource:
    url: ${AGENTSHIELD_DB_URL:jdbc:postgresql://localhost:5432/agentshield}
    username: ${AGENTSHIELD_DB_USERNAME:agentshield}
    password: ${AGENTSHIELD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      # "update" auto-creates/updates tables based on entities.
      # In production, use "validate" + Flyway/Liquibase migrations.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---- Jackson (JSON serialization) ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ---- Server ----
server:
  port: ${PORT:8080}

# ---- Logging ----
logging:
  level:
    com.agentshield: DEBUG
    org.springframework.security: DEBUG

# ---- AgentShield settings ----
agentshield:
  jwt:
    # Required, no default. At least 32 bytes (256 bits) for HMAC-SHA256;
    # generate one with: openssl rand -base64 48
    secret: ${AGENTSHIELD_JWT_SECRET:}
    expiration-ms: ${AGENTSHIELD_JWT_EXPIRATION_MS:86400000}  # 24 hours
  approval:
    expiration-hours: 24     # Pending approvals expire after 24 hours
  seed:
    # Seeds demo@agentshield.com and admin@agentshield.com on startup.
    # Set AGENTSHIELD_SEED_DEMO_USERS=false outside local development.
    demo-users: ${AGENTSHIELD_SEED_DEMO_USERS:true}
    demo-user-password: ${AGENTSHIELD_DEMO_USER_PASSWORD:Password123!}
    demo-admin-password: ${AGENTSHIELD_DEMO_ADMIN_PASSWORD:AdminPass123!}

# ---- Swagger/OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
